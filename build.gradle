apply plugin: "java"

version = '1.0'

sourceSets.main.java.srcDirs = ["src"]

repositories {
    mavenCentral()

    //Downloads the dependencies JAR file from Mindustry releases; does not use any real repository. Surprisingly, this is the most reliable option.
    ivy {
        url = 'https://github.com/'
        patternLayout { artifact '/[organisation]/[module]/releases/download/[revision]/dependencies.jar' }
        metadataSources { artifact() }
    }

    //If the version is set to 'latest', downloads the latest Mindustry *release* as a dependency
    ivy {
        url = 'https://github.com/'
        patternLayout { artifact '/[organisation]/[module]/releases/[revision]/download/dependencies.jar' }
        metadataSources { artifact() }
    }

    //For depending on the absolute newest commit for Mindustry
    ivy {
        url = 'https://github.com/'
        patternLayout { artifact '/[organisation]/[module]/releases/download/master/[revision].jar' }
        metadataSources { artifact() }
    }
}
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}


ext {
    // Mindustry version to depend on.
    // Valid values:
    // - latest: depend on the latest release of mindustry
    // - be: depend on the very latest commit of mindustry
    // - v<number>: depend on a specific commit
    mindustryVersion = "v160.7"
    isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
    sdkRoot = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
}

dependencies {
    compileOnly mindustryVersion == "be" ? "Anuken:MindustryBuilds:latest" : "Anuken:Mindustry:$mindustryVersion"
}

tasks.register('jarAndroid', JavaExec) {
    dependsOn "jar"
    def projectName = project.name
    group = 'build'
    description = 'Dexes the desktop mod JAR with the Android SDK d8 tool.'
    def buildToolsRoot = sdkRoot ? new File(sdkRoot, "build-tools") : null
    def d8Jar = buildToolsRoot?.listFiles()
            ?.findAll { new File(it, "lib/d8.jar").isFile() }
            ?.sort { it.name }
            ?.reverse()
            ?.find { true }
            ?.toPath()
            ?.resolve("lib/d8.jar")
            ?.toFile()
    def javaExecutable = new File(System.getProperty("java.home"), isWindows ? "bin/java.exe" : "bin/java")

    classpath = d8Jar ? files(d8Jar) : files()
    mainClass = "com.android.tools.r8.D8"
    executable = javaExecutable.absolutePath

    doFirst {
        if (!sdkRoot || !new File(sdkRoot).exists()) throw new GradleException("No valid Android SDK found. Ensure that ANDROID_HOME is set to your Android SDK directory.")

        def platformRoot = new File("$sdkRoot/platforms/").listFiles().sort().reverse().find { f -> new File(f, "android.jar").exists() }

        if (!platformRoot) throw new GradleException("No android.jar found. Ensure that you have an Android platform installed.")

        if (!d8Jar) throw new GradleException("No d8.jar found. Install a recent Android SDK Build Tools version.")

        def dependencies = configurations.compileClasspath.asList() +
                configurations.runtimeClasspath.asList() +
                [new File(platformRoot, "android.jar")]
        def desktopJar = layout.buildDirectory.file("libs/${projectName}Desktop.jar").get().asFile
        def androidJar = layout.buildDirectory.file("libs/${projectName}Android.jar").get().asFile
        def d8Args = ["--min-api", "14", "--output", androidJar.absolutePath]

        dependencies.each { dependency ->
            d8Args.addAll(["--classpath", dependency.absolutePath])
        }
        d8Args.add(desktopJar.absolutePath)
        setArgs(d8Args)

        println("Using d8: ${d8Jar.absolutePath}")
        println("Using Java: ${javaExecutable.absolutePath}")
    }
}

tasks.register('runMis', Exec) {
    group = 'build' // 可选：在IDEA Gradle面板中的分组
    description = '运行项目根目录下的 mis 可执行文件'

    // 指定要执行的命令
    // './mis' 表示当前目录下的 mis 文件
    commandLine './mis'

    // 如果该文件需要参数，可以追加在后面，例如：
    // commandLine './mis', 'arg1', 'arg2'

    // 确保工作目录是项目根目录
    workingDir = project.projectDir
}


jar {
    archiveFileName = "${project.name}Desktop.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    from(projectDir) {
        include "mod.hjson"
    }

    from("assets/") {
        include "**"
    }
}

tasks.register('deploy', Jar) {
    def projectName = project.name
    dependsOn jarAndroid
    dependsOn jar
    archiveFileName = "${projectName}.jar"

    from { [zipTree("build/libs/${projectName}Desktop.jar"), zipTree("build/libs/${projectName}Android.jar")] }

    doLast {
        delete {
            delete "build/libs/${projectName}Android.jar"
        }
    }
}

def installMod = tasks.register("installMod", Copy) {
    dependsOn(deploy)
    description = "打包完成后自动复制到 Mindustry 的 mods 目录"
    group = "build"

    def modsDir = isWindows
            ? new File(System.getenv("APPDATA"), "Mindustry/mods")
            : new File(System.getProperty("user.home"), ".local/share/Mindustry/mods")

    from(layout.buildDirectory.file("libs/${project.name}.jar"))
    into(modsDir)

    doFirst {
        if (!modsDir.exists()) {
            modsDir.mkdirs()
            println("已创建 mods 目录: ${modsDir.absolutePath}")
        }
        println("将模组复制到: ${modsDir.absolutePath}")
    }
}
